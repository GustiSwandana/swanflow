<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#061224"/>
      <stop offset="100%" stop-color="#03251c"/>
    </linearGradient>

    <!-- Ring Accent -->
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Swan Neck & Body Gradient -->
    <linearGradient id="swanBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="25%" stop-color="#34d399"/>
      <stop offset="65%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Wing 1 (Top Feather) -->
    <linearGradient id="wing1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="80%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <!-- Wing 2 (Mid Feather) -->
    <linearGradient id="wing2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>

    <!-- Wing 3 (Low Feather) -->
    <linearGradient id="wing3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#115e59"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>

    <!-- Water Base Wave -->
    <linearGradient id="waterWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0"/>
      <stop offset="40%" stop-color="#14b8a6" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>

    <!-- Amber Beak -->
    <linearGradient id="beakAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="512" height="512" rx="124" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#ring)" stroke-width="2.5"/>

  <!-- Perfectly scaled & centered swan graphic group -->
  <g filter="url(#glow)" transform="translate(256, 268) scale(0.88) translate(-256, -256)">

    <!-- Fluid Ripple Wave at bottom -->
    <path d="M 115 400 C 185 385, 260 400, 330 390 C 385 382, 425 368, 440 358 C 405 390, 335 410, 250 410 C 175 410, 130 402, 115 400 Z" 
          fill="url(#waterWave)"/>

    <!-- Wing 3 (Lowest Feather Wave) -->
    <path d="M 235 358 C 285 350, 345 330, 390 288 C 424 256, 440 220, 444 185 C 430 228, 396 278, 338 318 C 290 350, 248 358, 235 358 Z" 
          fill="url(#wing3)"/>

    <!-- Wing 2 (Middle Feather Wave) -->
    <path d="M 215 335 C 265 320, 332 278, 384 218 C 418 172, 435 122, 438 82 C 422 132, 382 198, 322 254 C 268 304, 226 328, 215 335 Z" 
          fill="url(#wing2)"/>

    <!-- Wing 1 (Top Sweeping Wing Feather - Skyward Flight) -->
    <path d="M 200 305 C 242 272, 310 220, 368 145 C 408 90, 424 40, 426 15 C 408 60, 362 135, 296 208 C 244 265, 212 292, 200 305 Z" 
          fill="url(#wing1)"/>

    <!-- Swan Breast, Body & Elegant S-Neck -->
    <path d="M 155 360 
             C 120 335, 110 280, 135 225 
             C 152 188, 185 160, 205 125 
             C 218 102, 222 75, 215 55 
             C 210 40, 198 32, 185 36 
             C 172 40, 164 52, 162 65 
             C 160 78, 168 90, 180 92 
             C 160 88, 142 75, 144 52 
             C 146 30, 168 15, 198 16 
             C 230 18, 248 38, 246 72 
             C 244 105, 225 138, 200 175 
             C 175 212, 155 248, 162 290 
             C 170 335, 210 360, 260 365 
             C 300 368, 340 355, 365 340 
             C 325 375, 265 390, 205 385 
             C 175 382, 160 372, 155 360 Z" 
          fill="url(#swanBody)"/>

    <!-- Sleek Minimalist Beak -->
    <path d="M 166 52 L 130 68 L 160 76 Z" fill="url(#beakAmber)"/>

    <!-- Swan Crown Eye Dot -->
    <circle cx="178" cy="48" r="3.5" fill="#020617"/>

    <!-- Apex Prosperity Spark -->
    <circle cx="426" cy="15" r="4.5" fill="#ffffff"/>
    <circle cx="426" cy="15" r="11" fill="#a7f3d0" opacity="0.6"/>

  </g>
</svg>
