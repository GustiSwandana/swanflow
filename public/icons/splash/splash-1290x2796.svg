<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1290" height="2796" fill="url(#bg)"/>
  <rect width="1290" height="2796" fill="url(#glow)"/>
  <!-- Outer ring -->
  <circle cx="645" cy="1174.32" r="163" fill="none" stroke="#10b981" stroke-width="8" opacity="0.25"/>
  <!-- Icon circle -->
  <circle cx="645" cy="1174.32" r="125" fill="url(#icon)"/>
  <!-- Letter S -->
  <text x="645" y="1226" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-weight="700" font-size="149" fill="white" text-anchor="middle">S</text>
  <!-- App name -->
  <text x="645" y="1479" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-weight="700" font-size="92" fill="#f1f5f9" text-anchor="middle">SwanFlow</text>
  <!-- Tagline -->
  <text x="645" y="1580" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-weight="500" font-size="53" fill="#64748b" text-anchor="middle">Personal Finance Tracker</text>
</svg>