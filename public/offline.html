<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <meta name="color-scheme" content="light dark">
    <title>Mode Offline - SwanFlow</title>
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #020617;
            color: #f8fafc;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(1.5rem, var(--sat)) 1.5rem max(1.5rem, var(--sab)) 1.5rem;
            text-align: center;
        }
        .offline-card {
            width: 100%;
            max-width: 380px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 2.25rem 1.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }
        .icon-circle {
            width: 72px;
            height: 72px;
            margin: 0 auto 1.5rem;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(13, 148, 136, 0.2));
            border: 1px solid rgba(16, 185, 129, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #34d399;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.2);
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }
        p {
            font-size: 0.875rem;
            line-height: 1.5;
            color: #94a3b8;
            margin-bottom: 1.75rem;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 9999px;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #fbbf24;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 9999px;
            background: #fbbf24;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }
        .btn-retry {
            width: 100%;
            padding: 0.875rem 1.25rem;
            border-radius: 18px;
            background: linear-gradient(135deg, #059669, #0d9488);
            border: none;
            color: #ffffff;
            font-size: 0.875rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(5, 150, 105, 0.3);
            transition: transform 0.15s, opacity 0.15s;
        }
        .btn-retry:active {
            transform: scale(0.97);
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon-circle">
            <svg width="36" height="36" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
            </svg>
        </div>
        <div class="badge">
            <span class="dot"></span>
            <span>Tidak Terhubung Internet</span>
        </div>
        <h1>Sedang Offline</h1>
        <p>Anda saat ini sedang tidak terhubung ke jaringan. SwanFlow menyimpan data Anda secara lokal dan akan otomatis menyinkronkannya saat online kembali.</p>
        <button type="button" class="btn-retry" onclick="window.location.reload()">
            Coba Muat Ulang
        </button>
    </div>
    <script>
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
